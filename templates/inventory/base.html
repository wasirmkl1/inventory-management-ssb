{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sani Shwapno Bazar Inventory{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header no-print">
        <h1>Sani Shwapno Bazar</h1>
        <div class="subtitle">Inventory Management</div>
    </header>

    <nav class="tabs no-print">
        <a href="{% url 'inventory:inventory_list' %}" class="{% if active_tab == 'inventory' %}active{% endif %}">Inventory</a>
        <a href="{% url 'inventory:expiry_list' %}" class="{% if active_tab == 'expiry' %}active{% endif %}">Expiry</a>
        <a href="{% url 'inventory:reports_index' %}" class="{% if active_tab == 'reports' %}active{% endif %}">Reports</a>
        <a href="/admin/" target="_blank">Admin (bulk add)</a>
    </nav>

    <main>
        {% if messages %}
        <ul class="messages no-print">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
